{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<main class="auth-page-wrapper">
    <div class="auth-form-container">
        <div class="auth-container auth-container--login">
            <div class="Legend">
                <h1 class="auth-title">Change Password</h1>
            </div>

            <form class="auth-form" method="post" action="{% url 'accounts:password_change' %}">
                {% csrf_token %}
                {% include "partials/form_errors.html" with form=form %}
                <div class="InputField">
                    <label for="{{ form.old_password.id_for_label }}">Current password</label>
                    <input type="password" id="{{ form.old_password.id_for_label }}" name="{{ form.old_password.html_name }}" class="Input{% if form.old_password.errors %} is-invalid{% endif %}" required>
                </div>
                <div class="InputField">
                    <label for="{{ form.new_password1.id_for_label }}">New password</label>
                    <input type="password" id="{{ form.new_password1.id_for_label }}" name="{{ form.new_password1.html_name }}" class="Input{% if form.new_password1.errors %} is-invalid{% endif %}" required>
                </div>
                <div class="InputField">
                    <label for="{{ form.new_password2.id_for_label }}">Confirm new password</label>
                    <input type="password" id="{{ form.new_password2.id_for_label }}" name="{{ form.new_password2.html_name }}" class="Input{% if form.new_password2.errors %} is-invalid{% endif %}" required>
                </div>

                <div class="ButtonGroup">
                    <button type="submit" class="button button--primary">Change Password</button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
