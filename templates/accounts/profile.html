{% extends "base.html" %}

{% block title %}My Account{% endblock %}

{% block content %}
<main class="account-page-wrapper">
    <div class="account-container">
        <div class="account-form-container">
            <h2 class="account-form-title">Personal Info</h2>
            <form method="post" action="{% url 'accounts:profile' %}">
                {% csrf_token %}
                {% include "partials/form_errors.html" with form=form %}
                <div class="checkout-form-group">
                    <label for="{{ form.first_name.id_for_label }}">First name</label>
                    <input type="text" id="{{ form.first_name.id_for_label }}" name="{{ form.first_name.html_name }}" value="{{ form.first_name.value|default:'' }}" class="Input{% if form.first_name.errors %} is-invalid{% endif %}">
                </div>
                <div class="checkout-form-group">
                    <label for="{{ form.last_name.id_for_label }}">Last name</label>
                    <input type="text" id="{{ form.last_name.id_for_label }}" name="{{ form.last_name.html_name }}" value="{{ form.last_name.value|default:'' }}" class="Input{% if form.last_name.errors %} is-invalid{% endif %}">
                </div>
                <div class="checkout-form-group">
                    <label for="{{ form.email.id_for_label }}">Email</label>
                    <input type="email" id="{{ form.email.id_for_label }}" name="{{ form.email.html_name }}" value="{{ form.email.value|default:'' }}" class="Input{% if form.email.errors %} is-invalid{% endif %}">
                </div>
                <div class="checkout-form-group">
                    <label for="{{ form.phone.id_for_label }}">Phone number</label>
                    <input type="tel" id="{{ form.phone.id_for_label }}" name="{{ form.phone.html_name }}" value="{{ form.phone.value|default:'' }}" class="Input{% if form.phone.errors %} is-invalid{% endif %}">
                </div>
                <div class="checkout-form-group">
                    <label for="{{ form.default_address.id_for_label }}">Default shipping address</label>
                    <textarea id="{{ form.default_address.id_for_label }}" name="{{ form.default_address.html_name }}" class="Textarea{% if form.default_address.errors %} is-invalid{% endif %}" rows="3">{{ form.default_address.value|default:'' }}</textarea>
                </div>
                <button type="submit" class="button button--primary button--full-width">Save</button>
            </form>

            <div class="account-links">
                <a href="{% url 'orders:order_list' %}" class="button button--secondary button--full-width">Order History</a>
                <a href="{% url 'accounts:password_change' %}" class="button button--secondary button--full-width">Change Password</a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="button button--secondary button--full-width">Logout</button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
