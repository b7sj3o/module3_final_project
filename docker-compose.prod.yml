services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput
      && gunicorn config.wsgi:application -c gunicorn.conf.py"
    env_file: .env.production
    expose:
      - "8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production  # Caddyfile reads SITE_DOMAIN from it
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data  # certificates: keep them, Let's Encrypt limits new ones
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy


volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
